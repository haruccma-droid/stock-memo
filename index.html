<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>株メモ</title>
</head>
<body>

<h1>📈 株メモ</h1>
<h2>保有株</h2>

<input id="name" placeholder="銘柄名"><br><br>
<input id="buy" type="number" placeholder="買値"><br><br>
<input id="qty" type="number" placeholder="保有株数"><br><br>
<input id="now" type="number" placeholder="現在株価"><br><br>

<button id="add">追加</button>

<div id="list"></div>

<script>
const KEY="stockMemo";
let stocks=[];

try{
  stocks=JSON.parse(localStorage.getItem(KEY))||[];
}catch(e){
  stocks=[];
}

const nameEl=document.getElementById("name");
const buyEl=document.getElementById("buy");
const qtyEl=document.getElementById("qty");
const nowEl=document.getElementById("now");
const list=document.getElementById("list");

function save(){
  localStorage.setItem(KEY,JSON.stringify(stocks));
}

function show(){
  list.innerHTML="";

  stocks.forEach((s,i)=>{
    const cost=s.buy*s.qty;
    const value=s.now*s.qty;
    const profit=value-cost;

    const box=document.createElement("div");
    box.style.cssText="margin-top:20px;padding:12px;border:1px solid #aaa;border-radius:10px";

    box.innerHTML=
      "<b>"+s.name+"</b><br>"+
      "買値: "+s.buy.toLocaleString()+"<br>"+
      "保有株数: "+s.qty.toLocaleString()+"株<br>"+
      "現在株価: "+s.now.toLocaleString()+"<br>"+
      "取得額: "+cost.toLocaleString()+"<br>"+
      "評価額: "+value.toLocaleString()+"<br>"+
      "損益: "+profit.toLocaleString()+"<br><br>";

    const del=document.createElement("button");
    del.textContent="削除";

    del.onclick=()=>{
      stocks.splice(i,1);
      save();
      show();
    };

    box.appendChild(del);
    list.appendChild(box);
  });
}

document.getElementById("add").onclick=()=>{
  const name=nameEl.value.trim();

  if(!name){
    alert("銘柄名を入力してください");
    return;
  }

  if(buyEl.value==="" || qtyEl.value==="" || nowEl.value===""){
    alert("全部入力してください");
    return;
  }

  stocks.push({
    name:name,
    buy:Number(buyEl.value),
    qty:Number(qtyEl.value),
    now:Number(nowEl.value)
  });

  save();
  show();

  nameEl.value="";
  buyEl.value="";
  qtyEl.value="";
  nowEl.value="";
};

show();
</script>

</body>
</html>
