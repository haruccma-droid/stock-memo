<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>株メモ</title>
</head>
<body>

<h1>📈 株メモ</h1>
<h2>保有株</h2>

<input id="stock" type="text" placeholder="銘柄名"><br><br>
<input id="price" type="number" placeholder="買値"><br><br>
<input id="shares" type="number" placeholder="保有株数"><br><br>
<input id="currentPrice" type="number" placeholder="現在株価"><br><br>

<button onclick="addStock()">追加</button>

<div id="stockList"></div>

<script>
let stocks = JSON.parse(localStorage.getItem("stocks2")) || [];

function saveStocks() {
  localStorage.setItem("stocks2", JSON.stringify(stocks));
}

function addStock() {
  const name = document.getElementById("stock").value.trim();
  const price = Number(document.getElementById("price").value);
  const shares = Number(document.getElementById("shares").value);
  const currentPrice = Number(document.getElementById("currentPrice").value);

  if (!name) {
    alert("銘柄名を入力してください");
    return;
  }

  stocks.push({
    name: name,
    price: price,
    shares: shares,
    currentPrice: currentPrice
  });

  saveStocks();
  showStocks();

  document.getElementById("stock").value = "";
  document.getElementById("price").value = "";
  document.getElementById("shares").value = "";
  document.getElementById("currentPrice").value = "";
}

function deleteStock(index) {
  stocks.splice(index, 1);
  saveStocks();
  showStocks();
}

function showStocks() {
  const list = document.getElementById("stockList");
  list.innerHTML = "";

  stocks.forEach((stock, index) => {
    const cost = stock.price * stock.shares;
    const value = stock.currentPrice * stock.shares;
    const profit = value - cost;

    const item = document.createElement("div");

    item.innerHTML =
      "<hr>" +
      "<strong>" + stock.name + "</strong><br>" +
      "買値: " + stock.price.toLocaleString() + "<br>" +
      "保有株数: " + stock.shares.toLocaleString() + "株<br>" +
      "現在株価: " + stock.currentPrice.toLocaleString() + "<br>" +
      "評価額: " + value.toLocaleString() + "<br>" +
      "損益: " + profit.toLocaleString() + "<br><br>";

    const button = document.createElement("button");
    button.textContent = "削除";
    button.onclick = function() {
      deleteStock(index);
    };

    item.appendChild(button);
    list.appendChild(item);
  });
}

showStocks();
</script>

</body>
</html>
